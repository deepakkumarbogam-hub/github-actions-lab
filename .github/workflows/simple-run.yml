name: Simple Auto Run

# This alone is what makes it "automatic" -- any push to main
# triggers this workflow with zero manual action needed.
on:
  push:
    branches: [main]

jobs:
  run-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the script
        run: python app11.py
